<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZIP Splitter Tool</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 20px;
      background: #0f172a; color: #f8fafc;
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
    }
    .card {
      width: 100%; max-width: 480px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 16px; padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h2 { margin: 0 0 6px; font-size: 22px; color: #38bdf8; }
    p.sub { margin: 0 0 20px; font-size: 13px; color: #94a3b8; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #e2e8f0; }
    input[type="file"], input[type="number"], select {
      width: 100%; padding: 12px; margin-bottom: 16px;
      background: #0f172a; border: 1px solid #475569;
      border-radius: 10px; color: #fff; font-size: 15px;
    }
    button.primary {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: #0284c7; color: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: 0.2s;
    }
    button.primary:disabled { background: #475569; cursor: not-allowed; }
    .status { margin-top: 14px; font-size: 14px; text-align: center; color: #fbbf24; }
    .error { color: #f87171; }
    .results { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .item {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; border: 1px solid #334155;
      padding: 12px 14px; border-radius: 10px;
    }
    .item-info { font-size: 13px; word-break: break-all; padding-right: 10px; }
    .item-info span { display: block; color: #94a3b8; font-size: 12px; margin-top: 2px; }
    .dl-btn {
      background: #10b981; color: #052e16; text-decoration: none;
      padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 13px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>ZIP Splitter Tool</h2>
    <p class="sub">បំបែក File Zip ធំៗទៅជាភាគតូចៗសម្រាប់ទាញយកលើ iPhone</p>

    <form id="splitForm">
      <label>១. ជ្រើសរើស File (.zip)</label>
      <input type="file" id="fileInput" name="file" accept=".zip,application/zip" required />

      <label>២. ចំនួន File ដែលចង់បំបែក</label>
      <input type="number" name="parts" value="4" min="2" max="20" required />

      <label>៣. ប្រភេទនៃការបំបែក</label>
      <select name="mode">
        <option value="standalone">File Zip ដាច់ដោយឡែកពីគ្នា (បើកមួយៗបាន)</option>
        <option value="raw">ភាគតភ្ជាប់គ្នា (.zip.001, .zip.002...)</option>
      </select>

      <button type="submit" class="primary" id="submitBtn">ចាប់ផ្តើមបំបែក File</button>
    </form>

    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
  </div>

  <script>
    const form = document.getElementById("splitForm");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultsEl.innerHTML = "";
      statusEl.className = "status";
      statusEl.textContent = "កំពុង Upload និងបំបែក File សូមរង់ចាំបន្តិច...";
      submitBtn.disabled = true;

      const formData = new FormData(form);

      try {
        const res = await fetch("/split", { method: "POST", body: formData });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "បរាជ័យក្នុងការបំបែក File");
        }

        statusEl.textContent = `បំបែកបានជោគជ័យចំនួន ${data.parts.length} File៖`;
        data.parts.forEach((p) => {
          const extra = p.files_count ? ` • ${p.files_count} files` : "";
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = `
            <div class="item-info">
              <strong>${p.name}</strong>
              <span>ទំហំ៖ ${p.size_mb} MB${extra}</span>
            </div>
            <a class="dl-btn" href="${p.url}" download>Download</a>
          `;
          resultsEl.appendChild(div);
        });
      } catch (err) {
        statusEl.className = "status error";
        statusEl.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
